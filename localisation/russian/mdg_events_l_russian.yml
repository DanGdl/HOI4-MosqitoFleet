 mdg_naval_support_to_spain.05.t: "Отправляйте катера в Испанию"
 mdg_naval_support_to_spain.05.desc: "[FROM.GetAdjective]ий флот готовиться получить наши катера. Будем надеяться, они сослужат там добрую службу."
 mdg_naval_support_to_spain.05.a: "Ариведерчи!"

