 mdg_naval_support_to_spain.05.desc: "[FROM.GetNameDef]海軍は我々の魚雷艇を受け入れる準備を進めている。彼の地で存分に働いてくれることを願おう。"
 mdg_naval_support_to_spain.05.a: "幸運を祈る！"

