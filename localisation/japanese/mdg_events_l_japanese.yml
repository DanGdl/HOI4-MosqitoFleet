 ITA_auxiliary_ships_approved_tt: "60日以内に[ROOT.GetEscortShipsSender]が[ROOT.GetEscortShipsReceiver]に§Y補助巡洋艦2隻§!を引き渡す。"

 mdg_naval_support_to_spain.01.t: "[ITA.GetNameDefCap]が補助巡洋艦の提供を申し出る"
 mdg_naval_support_to_spain.01.desc: "[FROM.GetNameDefCap]は支援として補助巡洋艦2隻を送ると申し出ている。実に寛大な申し出だ。"
 mdg_naval_support_to_spain.01.a: "寛大な申し出に感謝する！"
 mdg_naval_support_to_spain.01.b: "感謝するが、自力で何とかする"

 mdg_naval_support_to_spain.02.t: "補助巡洋艦をスペインへ送る準備をせよ"
 mdg_naval_support_to_spain.02.desc: "[FROM.GetNameDef]海軍は我々の補助巡洋艦を受け入れる準備を進めている。彼の地で存分に働いてくれることを願おう。"
 mdg_naval_support_to_spain.02.a: "Arrivederci!"

 mdg_naval_support_to_spain.03.t: "[FROM.GetNameDefCap]が補助巡洋艦を辞退"
 mdg_naval_support_to_spain.03.desc: "[FROM.GetNameDefCap]は我々の補助巡洋艦を辞退した。このような申し出を断るとは、よほど強力な艦隊を持っているのだろう！"

